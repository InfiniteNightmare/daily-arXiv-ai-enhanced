# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: arXiv-daily-ai-enhanced

on:
  schedule:
    - cron: "30 1 * * 1-5"
  workflow_dispatch:
    inputs:
      process_date:
        description: "Date to process in YYYY-MM-DD; leave empty to use today's UTC date"
        required: false
        type: string


jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        uv sync
        
    - name: Crawl arXiv papers
      id: crawl_step
      run: |
        source .venv/bin/activate
        requested_date="${{ github.event.inputs.process_date }}"
        current_utc_date=$(date -u "+%Y-%m-%d")
        categories="${{ vars.CATEGORIES }}"
        arxiv_metadata_batch_size="${{ vars.ARXIV_METADATA_BATCH_SIZE }}"
        arxiv_api_delay_seconds="${{ vars.ARXIV_API_DELAY_SECONDS }}"
        arxiv_api_num_retries="${{ vars.ARXIV_API_NUM_RETRIES }}"
        arxiv_metadata_max_seconds="${{ vars.ARXIV_METADATA_MAX_SECONDS }}"
        if [ -z "$categories" ]; then categories="cs.CV"; fi
        if [ -z "$arxiv_metadata_batch_size" ]; then arxiv_metadata_batch_size="20"; fi
        if [ -z "$arxiv_api_delay_seconds" ]; then arxiv_api_delay_seconds="0.5"; fi
        if [ -z "$arxiv_api_num_retries" ]; then arxiv_api_num_retries="0"; fi
        if [ -z "$arxiv_metadata_max_seconds" ]; then arxiv_metadata_max_seconds="1800"; fi

        mkdir -p data assets
        git fetch origin +refs/heads/data:refs/remotes/origin/data || true
        git checkout origin/data -- data assets/file-list.txt 2>/dev/null || true

        if [ -n "$requested_date" ]; then
          today="$requested_date"
        else
          today="$current_utc_date"
        fi

        echo "crawl_date=$today" >> "$GITHUB_OUTPUT"

        if [[ ! "$today" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
          echo "Invalid process_date: $today. Expected YYYY-MM-DD."
          exit 1
        fi
        echo "开始爬取 $today 的arXiv论文... / Starting to crawl $today arXiv papers..."

        export TOKEN_GITHUB=${{ secrets.TOKEN_GITHUB }}
        export CATEGORIES="$categories"
        export ARXIV_METADATA_BATCH_SIZE="$arxiv_metadata_batch_size"
        export ARXIV_API_DELAY_SECONDS="$arxiv_api_delay_seconds"
        export ARXIV_API_NUM_RETRIES="$arxiv_api_num_retries"
        export ARXIV_METADATA_MAX_SECONDS="$arxiv_metadata_max_seconds"

        if [ -s "data/${today}.jsonl" ]; then
          echo "发现已存在的原始数据，跳过重新爬取 / Found existing raw data, skipping crawl"
          echo "has_new_content=true" >> "$GITHUB_OUTPUT"
        else
          if [ "$today" != "$current_utc_date" ] && [ ! -s "data/_pending/${today}.jsonl" ]; then
            echo "历史日期 $today 在 data 分支没有原始数据，不能用 /new 页面伪造回填 / Historical date $today has no raw data on data branch; refusing to backfill from /new"
            echo "has_new_content=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=raw_missing_for_historical_date" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          rm -f "data/${today}.jsonl"
          rm -f "data/${today}_AI_enhanced_"*.jsonl
          rm -f "data/${today}.md"
          set +e
          python daily_arxiv/batch_crawl.py --date "$today"
          crawl_exit_code=$?
          set -e

          echo "crawl_exit_code=$crawl_exit_code" >> "$GITHUB_OUTPUT"
          case $crawl_exit_code in
            0)
              echo "has_new_content=true" >> "$GITHUB_OUTPUT"
              ;;
            1)
              echo "has_new_content=false" >> "$GITHUB_OUTPUT"
              echo "skip_reason=no_new_content" >> "$GITHUB_OUTPUT"
              echo "没有新论文需要处理 / No new papers to process"
              exit 0
              ;;
            3)
              echo "has_new_content=false" >> "$GITHUB_OUTPUT"
              if [ -s "data/_pending/${today}.jsonl" ]; then
                echo "skip_reason=metadata_deferred" >> "$GITHUB_OUTPUT"
                echo "persist_state=true" >> "$GITHUB_OUTPUT"
                echo "metadata 尚未完整，保留 pending 状态并结束本次运行 / Metadata incomplete; pending state preserved"
              else
                echo "skip_reason=crawl_deferred" >> "$GITHUB_OUTPUT"
                echo "arXiv 列表暂时不可用，本次绿色跳过 / arXiv list temporarily unavailable; skipping this run"
              fi
              exit 0
              ;;
            *)
              echo "has_new_content=false" >> "$GITHUB_OUTPUT"
              echo "skip_reason=processing_error" >> "$GITHUB_OUTPUT"
              echo "爬取处理异常 / Crawl processing error"
              exit 1
              ;;
          esac
        fi

        if [ ! -s "data/${today}.jsonl" ]; then
          echo "爬取失败，未生成非空数据文件 / Crawling failed, no non-empty data file generated"
          exit 1
        fi

        echo "爬取完成 / Crawling completed"

    - name: Persist pending crawl state
      if: steps.crawl_step.outputs.persist_state == 'true'
      run: |
        today=${{ steps.crawl_step.outputs.crawl_date }}
        pending_file="data/_pending/${today}.jsonl"
        if [ ! -s "$pending_file" ]; then
          echo "没有可持久化的 pending seed 文件 / No pending seed file to persist"
          exit 0
        fi

        git config --global user.email "${{ vars.EMAIL }}"
        git config --global user.name "${{ vars.NAME }}"

        mkdir -p /tmp/crawl_state/data/_pending
        cp "$pending_file" "/tmp/crawl_state/data/_pending/${today}.jsonl"
        git reset -- data assets/file-list.txt 2>/dev/null || true
        rm -rf data 2>/dev/null || true
        rm -f assets/file-list.txt 2>/dev/null || true

        if git ls-remote --heads origin data | grep -q data; then
          git fetch origin data:data
          git checkout data
          git pull origin data || true
        else
          git checkout --orphan data
          git rm -rf --cached . 2>/dev/null || true
          mkdir -p data assets
          echo "# Data Branch" > README.md
          git add README.md
          git commit -m "chore: initialize data branch"
          git push origin data
        fi

        mkdir -p data/_pending
        cp "/tmp/crawl_state/data/_pending/${today}.jsonl" "$pending_file"
        git add "$pending_file"

        if git diff --staged --quiet; then
          echo "pending 状态没有变化 / Pending state unchanged"
        else
          git commit -m "chore: checkpoint pending crawl for $today"
          git push origin data
          echo "pending 状态已保存到 data 分支 / Pending state saved to data branch"
        fi

    - name: Check for duplicates
      id: dedup_check
      if: steps.crawl_step.outputs.has_new_content == 'true'
      run: |
        source .venv/bin/activate
        today=${{ steps.crawl_step.outputs.crawl_date }}
        echo "执行去重检查... / Performing intelligent deduplication check..."

        cd daily_arxiv
        set +e
        python daily_arxiv/check_stats.py --date "$today"
        dedup_exit_code=$?
        set -e

        echo "去重检查退出码: $dedup_exit_code / Dedup check exit code: $dedup_exit_code"
        echo "dedup_exit_code=$dedup_exit_code" >> $GITHUB_OUTPUT

        case $dedup_exit_code in
            0)
                echo "has_new_content=true" >> $GITHUB_OUTPUT
                ;;
            1)
                echo "has_new_content=false" >> $GITHUB_OUTPUT
                echo "skip_reason=no_new_content" >> $GITHUB_OUTPUT
                echo "去重后无新内容 / No new content after deduplication"
                ;;
            *)
                echo "❌ 去重处理失败，停止工作流 / Deduplication failed, stop workflow"
                echo "has_new_content=false" >> $GITHUB_OUTPUT
                echo "skip_reason=processing_error" >> $GITHUB_OUTPUT
                exit 1
                ;;
        esac

    - name: AI Enhancement Processing
      if: steps.dedup_check.outputs.has_new_content == 'true'
      run: |
        source .venv/bin/activate
        today=${{ steps.crawl_step.outputs.crawl_date }}
        language="${{ vars.LANGUAGE }}"
        model_name="${{ vars.MODEL_NAME }}"
        ai_max_workers="${{ vars.AI_MAX_WORKERS }}"
        ai_max_seconds="${{ vars.AI_MAX_SECONDS }}"
        ai_min_interval_seconds="${{ vars.AI_MIN_INTERVAL_SECONDS }}"
        ai_retry_attempts="${{ vars.AI_RETRY_ATTEMPTS }}"
        ai_retry_base_seconds="${{ vars.AI_RETRY_BASE_SECONDS }}"
        ai_retry_max_seconds="${{ vars.AI_RETRY_MAX_SECONDS }}"
        ai_request_timeout_seconds="${{ vars.AI_REQUEST_TIMEOUT_SECONDS }}"
        ai_circuit_breaker_failures="${{ vars.AI_CIRCUIT_BREAKER_FAILURES }}"
        if [ -z "$language" ]; then language="Chinese"; fi
        if [ -z "$model_name" ]; then model_name="deepseek-chat"; fi
        if [ -z "$ai_max_workers" ]; then ai_max_workers="1"; fi
        if [ -z "$ai_max_seconds" ]; then ai_max_seconds="1500"; fi
        if [ -z "$ai_min_interval_seconds" ]; then ai_min_interval_seconds="3"; fi
        if [ -z "$ai_retry_attempts" ]; then ai_retry_attempts="2"; fi
        if [ -z "$ai_retry_base_seconds" ]; then ai_retry_base_seconds="10"; fi
        if [ -z "$ai_retry_max_seconds" ]; then ai_retry_max_seconds="60"; fi
        if [ -z "$ai_request_timeout_seconds" ]; then ai_request_timeout_seconds="90"; fi
        if [ -z "$ai_circuit_breaker_failures" ]; then ai_circuit_breaker_failures="5"; fi
        echo "开始AI增强处理... / Starting AI enhancement processing..."

        cd ai
        export OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
        export OPENAI_BASE_URL=${{ secrets.OPENAI_BASE_URL }}
        export TOKEN_GITHUB=${{ secrets.TOKEN_GITHUB }}
        export LANGUAGE="$language"
        export MODEL_NAME="$model_name"
        export AI_MAX_SECONDS="$ai_max_seconds"
        export AI_MIN_INTERVAL_SECONDS="$ai_min_interval_seconds"
        export AI_RETRY_ATTEMPTS="$ai_retry_attempts"
        export AI_RETRY_BASE_SECONDS="$ai_retry_base_seconds"
        export AI_RETRY_MAX_SECONDS="$ai_retry_max_seconds"
        export AI_REQUEST_TIMEOUT_SECONDS="$ai_request_timeout_seconds"
        export AI_CIRCUIT_BREAKER_FAILURES="$ai_circuit_breaker_failures"
        export SENSITIVE_CHECK_ENABLED="${{ vars.SENSITIVE_CHECK_ENABLED }}"

        python enhance.py --data "../data/${today}.jsonl" --max_workers "$ai_max_workers"

        AI_FILE="../data/${today}_AI_enhanced_${LANGUAGE}.jsonl"
        if [ ! -s "$AI_FILE" ]; then
          echo "AI处理失败：增强文件为空 / AI processing failed: enhanced file is empty"
          echo "AI文件: $AI_FILE"
          exit 1
        fi
        echo "AI增强处理完成 / AI enhancement processing completed"

    - name: Convert to Markdown
      if: steps.dedup_check.outputs.has_new_content == 'true'
      run: |
        source .venv/bin/activate
        today=${{ steps.crawl_step.outputs.crawl_date }}
        language="${{ vars.LANGUAGE }}"
        if [ -z "$language" ]; then language="Chinese"; fi
        echo "转换为Markdown格式... / Converting to Markdown format..."

        # 设置环境变量 / Set environment variables
        export LANGUAGE="$language"

        cd to_md

        # 使用AI增强文件进行转换 / Use AI enhanced file for conversion
        AI_FILE="../data/${today}_AI_enhanced_${LANGUAGE}.jsonl"

        if [ -s "$AI_FILE" ]; then
            echo "使用AI增强文件进行转换... / Using AI enhanced file for conversion..."
            python convert.py --data "$AI_FILE"
        else
            echo "错误：未找到非空AI增强文件 / Error: non-empty AI enhanced file not found"
            echo "AI文件: $AI_FILE"
            exit 1
        fi

        # 检查转换是否成功 / Check if conversion was successful
        if [ $? -ne 0 ]; then
            echo "Markdown转换失败 / Markdown conversion failed"
            exit 1
        fi
        echo "Markdown转换完成 / Markdown conversion completed"

    - name: Update file list
      if: steps.dedup_check.outputs.has_new_content == 'true'
      run: |
        echo "更新文件列表... / Updating file list..."
        ls data/*.jsonl | sed 's|data/||' > assets/file-list.txt
        echo "文件列表更新完成 / File list updated"

    - name: Generate password hash and inject into config
      if: steps.dedup_check.outputs.has_new_content == 'true'
      run: |
        echo "🔐 Generating password hash for authentication..."

        PASSWORD="${{ secrets.ACCESS_PASSWORD }}"

        if [ -z "$PASSWORD" ]; then
          echo "⚠️  WARNING: ACCESS_PASSWORD not set in Secrets"
          echo "⚠️  Password protection will be DISABLED"
          echo "⚠️  To enable password protection, add ACCESS_PASSWORD in repository Secrets"
          echo "ℹ️  Website will remain publicly accessible without authentication"

          # Use a special value that will disable authentication
          PASSWORD_HASH="DISABLED_NO_PASSWORD_SET_IN_SECRETS"
        else
          # Generate SHA-256 hash using openssl
          PASSWORD_HASH=$(echo -n "$PASSWORD" | openssl dgst -sha256 -hex | awk '{print $2}')
          echo "✅ Password hash generated successfully"
          echo "✅ Hash length: ${#PASSWORD_HASH} characters"
          echo "🔐 Password protection is ENABLED"
        fi

        # Inject hash into auth-config.js
        if [ -f "js/auth-config.js" ]; then
          sed -i "s/PLACEHOLDER_PASSWORD_HASH/$PASSWORD_HASH/" js/auth-config.js
          echo "✅ Password hash injected into js/auth-config.js"
        else
          echo "❌ ERROR: js/auth-config.js not found!"
          exit 1
        fi

        echo "🔐 Authentication setup complete"

    - name: Summary
      run: |
        if [ "${{ steps.crawl_step.outputs.has_new_content }}" != "true" ]; then
          case "${{ steps.crawl_step.outputs.skip_reason }}" in
            "metadata_deferred")
              echo "ℹ️ 工作流完成：metadata 尚未完整，已保存 pending 状态，后续定时运行会继续补全 / Workflow completed: Metadata incomplete; pending state saved for a later run"
              ;;
            "crawl_deferred")
              echo "ℹ️ 工作流完成：arXiv 列表暂时不可用，本次未生成数据 / Workflow completed: arXiv list temporarily unavailable"
              ;;
            "raw_missing_for_historical_date")
              echo "ℹ️ 工作流完成：历史日期缺少 raw/pending，跳过以避免伪造回填 / Workflow completed: Historical date has no raw/pending state, skipped"
              ;;
            "no_new_content")
              echo "ℹ️ 工作流完成：没有新论文 / Workflow completed: No new papers"
              ;;
            "processing_error")
              echo "⚠️ 工作流完成：爬取处理出错 / Workflow completed: Crawl processing error"
              ;;
            *)
              echo "ℹ️ 工作流完成：爬取阶段跳过处理 / Workflow completed: Skipped during crawl stage"
              ;;
          esac
        elif [ "${{ steps.dedup_check.outputs.has_new_content }}" = "true" ]; then
          echo "✅ 工作流完成：爬取、去重和AI增强成功处理新内容 / Workflow completed: Crawl, deduplication and AI enhancement processed new content"
        else
          case "${{ steps.dedup_check.outputs.skip_reason }}" in
            "no_new_content")
              echo "ℹ️ 工作流完成：去重后无新内容 / Workflow completed: No new content after deduplication"
              ;;
            "processing_error")
              echo "⚠️ 工作流完成：处理出错 / Workflow completed: Processing error"
              ;;
            "unknown_error")
              echo "⚠️ 工作流完成：未知错误 / Workflow completed: Unknown error"
              ;;
            *)
              echo "ℹ️ 工作流完成：未知原因跳过处理 / Workflow completed: Skipped for unknown reason"
              ;;
          esac
        fi
        
    - name: Inject repository info into data-config.js
      if: steps.dedup_check.outputs.has_new_content == 'true'
      run: |
        echo "注入仓库信息到 data-config.js... / Injecting repository info into data-config.js..."
        
        # 获取仓库信息 / Get repository information
        REPO_OWNER="${{ github.repository_owner }}"
        REPO_NAME="${{ github.event.repository.name }}"
        
        echo "仓库所有者: $REPO_OWNER / Repository owner: $REPO_OWNER"
        echo "仓库名称: $REPO_NAME / Repository name: $REPO_NAME"
        
        # 注入仓库信息到 data-config.js / Inject repository info into data-config.js
        if [ -f "js/data-config.js" ]; then
          sed -i "s/PLACEHOLDER_REPO_OWNER/$REPO_OWNER/g" js/data-config.js
          sed -i "s/PLACEHOLDER_REPO_NAME/$REPO_NAME/g" js/data-config.js
          echo "✅ 仓库信息已注入到 js/data-config.js / Repository info injected into js/data-config.js"
        else
          echo "❌ ERROR: js/data-config.js not found!"
          exit 1
        fi

    - name: Commit code changes to main branch
      if: steps.dedup_check.outputs.has_new_content == 'true'
      run: |
        git config --global user.email "${{ vars.EMAIL }}"
        git config --global user.name "${{ vars.NAME }}"
        
        # 添加所有代码文件，但排除数据文件 / Add all code files, but exclude data files
        git add js/data-config.js
        git add .github/
        # 添加其他可能的代码变更，但排除 data/ 目录和 assets/file-list.txt
        # Add other possible code changes, but exclude data/ directory and assets/file-list.txt
        git add -A
        git reset -- data/* assets/file-list.txt 2>/dev/null || true
        
        # 检查是否有代码变更需要提交 / Check if there are code changes to commit
        if git diff --staged --quiet; then
          echo "没有代码变更需要提交 / No code changes to commit"
        else
          git commit -m "chore: update data-config.js with repository info"
          echo "代码变更已提交到 main 分支 / Code changes committed to main branch"
        fi

    - name: Push code changes to main branch
      if: steps.dedup_check.outputs.has_new_content == 'true'
      run: |
        # 设置Git配置以处理自动合并 / Set Git config for automatic merging
        git config pull.rebase true
        git config rebase.autoStash true
        
        # 尝试推送代码变更到 main 分支 / Try to push code changes to main branch
        for i in {1..3}; do
          echo "推送代码变更尝试 $i / Push code changes attempt $i"
          if git push origin main; then
            echo "代码变更推送成功 / Code changes pushed successfully"
            break
          else
            echo "推送失败，拉取最新变更... / Push failed, pulling latest changes..."
            git pull origin main --no-edit || true
            if [ $i -eq 3 ]; then
              echo "3次尝试后推送失败 / Failed to push after 3 attempts"
              exit 1
            fi
          fi
        done

    - name: Prepare data files for data branch
      if: steps.dedup_check.outputs.has_new_content == 'true'
      run: |
        echo "准备数据文件... / Preparing data files..."
        today=${{ steps.crawl_step.outputs.crawl_date }}
        
        # 创建临时目录保存数据文件 / Create temporary directory to save data files
        mkdir -p /tmp/data_files/data
        mkdir -p /tmp/data_files/assets
        
        # 复制数据文件到临时目录 / Copy data files to temporary directory
        cp -r data/* /tmp/data_files/data/ 2>/dev/null || true
        cp assets/file-list.txt /tmp/data_files/assets/ 2>/dev/null || true
        
        echo "数据文件已保存到临时目录 / Data files saved to temporary directory"

    - name: Setup and commit to data branch
      if: steps.dedup_check.outputs.has_new_content == 'true'
      run: |
        git config --global user.email "${{ vars.EMAIL }}"
        git config --global user.name "${{ vars.NAME }}"
        
        echo "设置 data 分支... / Setting up data branch..."
        today=${{ steps.crawl_step.outputs.crawl_date }}
        
        # 在切换分支前，清理工作目录中可能冲突的未跟踪文件
        # Before switching branches, clean untracked files that might conflict
        # 这些文件已经保存到临时目录，所以可以安全删除
        # These files are already saved to temporary directory, so safe to remove
        git reset -- data assets/file-list.txt 2>/dev/null || true
        rm -rf data/*.jsonl 2>/dev/null || true
        rm -f data/*.md 2>/dev/null || true
        rm -rf data/_pending 2>/dev/null || true
        rm -f assets/file-list.txt 2>/dev/null || true
        
        # 检查 data 分支是否存在 / Check if data branch exists
        if git ls-remote --heads origin data | grep -q data; then
          echo "data 分支已存在，切换到 data 分支 / Data branch exists, switching to data branch"
          git fetch origin data:data
          git checkout data
          git pull origin data || true
        else
          echo "data 分支不存在，创建新分支 / Data branch does not exist, creating new branch"
          # 创建空的 data 分支 / Create empty data branch
          git checkout --orphan data
          git rm -rf --cached . 2>/dev/null || true
          # 确保 data 和 assets 目录存在 / Ensure data and assets directories exist
          mkdir -p data assets
          echo "# Data Branch" > README.md
          git add README.md
          git commit -m "chore: initialize data branch"
          git push origin data
        fi
        
        # 从临时目录恢复数据文件 / Restore data files from temporary directory
        # 确保目录存在 / Ensure directories exist
        mkdir -p data assets
        cp -r /tmp/data_files/data/* data/ 2>/dev/null || true
        cp /tmp/data_files/assets/file-list.txt assets/ 2>/dev/null || true
        rm -f "data/_pending/${today}.jsonl" 2>/dev/null || true
        
        # 只添加数据文件 / Only add data files
        git add data/* 2>/dev/null || true
        git add -A data/_pending 2>/dev/null || true
        git add assets/file-list.txt 2>/dev/null || true
        
        # 检查是否有数据变更需要提交 / Check if there are data changes to commit
        if git diff --staged --quiet; then
          echo "没有数据变更需要提交 / No data changes to commit"
        else
          git commit -m "update: $today arXiv papers"
          echo "数据变更已提交到 data 分支 / Data changes committed to data branch"
        fi

    - name: Push data changes to data branch
      if: steps.dedup_check.outputs.has_new_content == 'true'
      run: |
        # 设置Git配置以处理自动合并 / Set Git config for automatic merging
        git config pull.rebase true
        git config rebase.autoStash true
        
        # 尝试推送数据变更到 data 分支 / Try to push data changes to data branch
        for i in {1..3}; do
          echo "推送数据变更尝试 $i / Push data changes attempt $i"
          if git push origin data; then
            echo "数据变更推送成功 / Data changes pushed successfully"
            break
          else
            echo "推送失败，拉取最新变更... / Push failed, pulling latest changes..."
            git pull origin data --no-edit || true
            if [ $i -eq 3 ]; then
              echo "3次尝试后推送失败 / Failed to push after 3 attempts"
              exit 1
            fi
          fi
        done
